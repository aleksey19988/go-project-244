name: lint and tests

on:
  push:
    branches: [ main, develop ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: true

      - name: Download and verify modules
        run: |
          go mod download
          go mod tidy
          go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          args: --timeout=5m

  test-and-sonar:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: true

      - name: Download modules
        run: |
          go mod download
          go mod tidy

      - name: Run tests with coverage
        run: |
          go test ./... \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -race

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=aleksey19988
            -Dsonar.projectKey=aleksey19988_go-project-244